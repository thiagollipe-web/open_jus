# Template local para revisão; nenhum deploy, alteração de serviço ou configuração remota foi executado.
# Plano Free, sem disco persistente: o índice é reconstruído no build, a partir do corpus versionado.
# O deploy troca para Go só no merge — até lá, o serviço em produção continua rodando o Python.
services:
  - type: web
    name: openjus-api
    runtime: go
    plan: free
    # Sem clone ou download: gera data/leis.db em todo build com os textos locais validados (6 leis).
    buildCommand: sh scripts/build_leis_iniciais.sh && go build -C api-go -o ../openjus-api ./cmd/api
    startCommand: ./openjus-api
    healthCheckPath: /api/saude
    envVars:
      - key: CORS_ORIGINS
        value: https://thiagollipe-web.github.io
      # Mantém separado do estado mutável; não aponte para DB_PATH.
      - key: LEIS_DB_PATH
        value: data/leis.db
      - key: DATAJUD_API_KEY
        sync: false
      - key: FREE_LLM_BASE_URL
        sync: false
      - key: FREE_LLM_API_KEY
        sync: false
      - key: FREE_LLM_MODEL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
